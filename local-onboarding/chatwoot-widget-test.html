<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste Chatwoot - Atendimento Delplata</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172026;
        background: #f4f6f8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #d9e1e7;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 12px 32px rgba(28, 39, 49, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.55;
      }

      code {
        background: #eef3f6;
        border: 1px solid #d9e1e7;
        border-radius: 4px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Teste do atendimento Delplata</h1>
      <p>Abra o balão de chat no canto da tela.</p>
      <p>Primeiro envie <code>/teste</code>. Depois envie uma mensagem como:</p>
      <p><code>Quero uma cotação para entrada dia 10 e saída dia 12, dois adultos.</code></p>
    </main>

    <script>
      (function (d, t) {
        var BASE_URL = "http://localhost:3001";
        var g = d.createElement(t);
        var s = d.getElementsByTagName(t)[0];
        g.src = BASE_URL + "/packs/js/sdk.js";
        g.async = true;
        s.parentNode.insertBefore(g, s);
        g.onload = function () {
          window.chatwootSDK.run({
            websiteToken: "WBmQsfTWF4NXwSPeBNa8zdDo",
            baseUrl: BASE_URL,
          });
        };
      })(document, "script");
    </script>
  </body>
</html>
